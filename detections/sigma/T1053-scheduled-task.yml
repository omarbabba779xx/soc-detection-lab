title: Scheduled Task Creation for Persistence
id: 1b9c8d0e-2f3a-4b5c-6d7e-8f9a0b1c2d3e
status: stable
description: Detects creation or modification of scheduled tasks often used for persistence or lateral movement
author: SocForge Lab
date: 2026-08-01
references:
  - https://attack.mitre.org/techniques/T1053/005/
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4698
      - 4702
  filter_system_tasks:
    SubjectUserName: 'SYSTEM'
    TaskName|startswith:
      - '\Microsoft\Windows\'
  condition: selection and not filter_system_tasks
falsepositives:
  - Legitimate software installing scheduled tasks
  - Windows Update operations
level: medium
fields:
  - SubjectUserName
  - TaskName
  - TaskContent
