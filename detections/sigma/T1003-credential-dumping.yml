title: LSASS Memory Access for Credential Dumping
id: 9f7a6b8c-0d1e-2f3a-4b5c-6d7e8f9a0b1c
status: stable
description: Detects suspicious access to LSASS process memory, a common technique for credential dumping
author: SocForge Lab
date: 2026-08-01
references:
  - https://attack.mitre.org/techniques/T1003/
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  category: process_access
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x40'
      - '0x1fffff'
      - '0x1410'
      - '0x143a'
  filter_known_tools:
    SourceImage|contains:
      - '\Windows\System32\lsass.exe'
      - '\Windows\System32\csrss.exe'
      - '\Windows\System32\wininit.exe'
      - '\Windows\System32\MsMpEng.exe'
  condition: selection and not filter_known_tools
falsepositives:
  - AV/EDR solutions accessing LSASS for monitoring
  - WerFault.exe during crash analysis
level: critical
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
  - SourceUser
