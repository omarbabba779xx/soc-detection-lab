title: Obfuscated Command Execution
id: 6c4d3e5f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
status: experimental
description: Detects execution of Base64-encoded or otherwise obfuscated commands in process arguments
author: SocForge Lab
date: 2026-08-01
references:
  - https://attack.mitre.org/techniques/T1027/
tags:
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_b64:
    CommandLine|re: '[A-Za-z0-9+/]{100,}={0,2}'
  selection_suspicious:
    CommandLine|contains:
      - 'FromBase64String'
      - 'Convert]::FromBase64'
      - 'char[]'
      - '[char]('
      - 'join(""'
      - '-split ""'
  condition: selection_b64 or selection_suspicious
falsepositives:
  - Some legitimate software using Base64 for data transport
level: medium
fields:
  - Image
  - CommandLine
  - User
