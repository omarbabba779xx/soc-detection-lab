title: SMB Admin Share Access
id: 8e6f5a7b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
status: stable
description: Detects access to Windows admin shares (ADMIN$, C$, IPC$) indicating possible lateral movement
author: SocForge Lab
date: 2026-08-01
references:
  - https://attack.mitre.org/techniques/T1021/002/
tags:
  - attack.lateral_movement
  - attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5140
    ShareName:
      - '\\*\ADMIN$'
      - '\\*\C$'
      - '\\*\IPC$'
  filter_legitimate_admin:
    IpAddress: '-'
  condition: selection and not filter_legitimate_admin
falsepositives:
  - Legitimate remote administration (RDP, PSRemoting)
  - Backup agents (Veeam, Windows Backup)
  - Domain join operations
level: high
fields:
  - SubjectUserName
  - ShareName
  - IpAddress
  - ObjectType
