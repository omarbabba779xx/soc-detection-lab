title: Valid Account Remote Logon
id: 7d5e4f6a-8b9c-0d1e-2f3a-4b5c6d7e8f9a
status: experimental
description: Detects remote interactive/network logon using privileged or service accounts outside business hours
author: SocForge Lab
date: 2026-08-01
references:
  - https://attack.mitre.org/techniques/T1078/
tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1078
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType:
      - 3
      - 10
    TargetUserName|contains:
      - 'administrator'
      - 'admin'
      - 'svc_'
  filter_local:
    IpAddress:
      - '127.0.0.1'
      - '::1'
      - '-'
  condition: selection and not filter_local
falsepositives:
  - Legitimate remote administration
  - Scheduled maintenance
level: medium
fields:
  - TargetUserName
  - IpAddress
  - LogonType
  - WorkstationName
