name: SocForge.Windows.NetworkConnections
description: |
  Collecte toutes les connexions réseau actives sur un endpoint Windows.
  Inclut les connexions établies, en écoute, et les PIDs associés.
  Utilisé pour détecter les communications C2 ou les connexions latérales.

author: SocForge Lab
type: CLIENT

parameters:
  - name: RemoteIPFilter
    description: Filtrer sur une IP distante (regex, vide = tout)
    default: ""
  - name: PortFilter
    description: Filtrer sur un port distant (0 = tout)
    default: "0"

sources:
  - name: Connections
    query: |
      LET conns = SELECT Pid, Family, Type, Status,
                         Laddr.IP AS LocalIP, Laddr.Port AS LocalPort,
                         Raddr.IP AS RemoteIP, Raddr.Port AS RemotePort
                  FROM netstat()
                  WHERE Status = "ESTABLISHED" OR Status = "LISTEN"

      LET enriched = SELECT c.Pid, c.Status, c.LocalIP, c.LocalPort,
                            c.RemoteIP, c.RemotePort,
                            p.Name AS ProcessName, p.Exe AS ProcessPath, p.Username
                     FROM conns AS c
                     JOIN (SELECT Pid, Name, Exe, Username FROM pslist()) AS p
                     ON c.Pid = p.Pid
                     WHERE if(condition=RemoteIPFilter,
                              then=c.RemoteIP =~ RemoteIPFilter,
                              else=TRUE)
                     AND if(condition=PortFilter != "0",
                            then=str(str=c.RemotePort) = PortFilter,
                            else=TRUE)

      SELECT * FROM enriched ORDER BY RemotePort
