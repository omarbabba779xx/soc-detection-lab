name: Custom.Server.MISP.Iocs
author: SocForge
description: |
  Reads the hunt-able attributes of a MISP event through the MISP REST
  API. The MISP key never appears in the artifact: it lives in the
  Velociraptor secret store (secret "misp_api", type "HTTP Secrets").

  Each row gives the MISP attribute and the pattern to look for in the
  Windows event logs. For a regkey|value IOC, only the value name is
  kept, because Sysmon 12/13 and 4688 log the key path in a different
  form (HKLM\... vs HKU\..., \REGISTRY\MACHINE\...).

type: SERVER

parameters:
  - name: MispUrl
    default: https://10.10.10.22
  - name: MispSecret
    default: misp_api
  - name: EventId
    default: "2"
  - name: IocTypes
    type: json_array
    default: '["text", "regkey|value"]'

sources:
  - query: |
      LET Attrs = SELECT * FROM foreach(
          row={
            SELECT parse_json(data=Content).response.Attribute AS A
            FROM http_client(secret=MispSecret, method='POST',
                             url=MispUrl + '/attributes/restSearch',
                             data=serialize(format='json',
                                            item=dict(eventid=EventId, type=IocTypes)))
            WHERE Response = 200
          },
          query={ SELECT * FROM foreach(row=A) })

      LET Needles = SELECT id AS AttributeId, event_id AS EventId, type AS Type,
                           value AS Value, comment AS Comment,
                           if(condition=type = 'regkey|value',
                              then=regex_replace(source=split(string=value, sep='''\|''')[0],
                                                 re='''^.*\\''', replace=''),
                              else=value) AS Needle
        FROM Attrs

      SELECT AttributeId, EventId, Type, Value, Comment, Needle,
             regex_replace(source=Needle, re='''([\\.+*?()\[\]{}|^$])''',
                           replace='''\$1''') AS Pattern
      FROM Needles
