name: Custom.Server.MISP.Sightings
author: SocForge
description: |
  Server monitoring artifact: closes the loop from Velociraptor back to
  MISP.

  Every PollSeconds it looks at the hunts tagged "misp" (created by
  Custom.Server.MISP.IOCHunt). For each client flow of those hunts that
  has finished and was not reported yet, it matches the EvtxHunter rows
  against the IOCs of the MISP event named in the hunt tag
  ("misp-event-<id>") and adds one MISP sighting per IOC seen on the
  endpoint. The sighting source names the host, the client and the hunt.

  Why polling and not System.Flow.Completion: on this server (0.77.1)
  that event queue only carries server-side flows; client flows of a
  hunt never show up in it, so a watcher on it never fires.

  A flow is reported once: the artifact reads its own previous results
  and skips any FlowId already present.

  The server runs this query as its own principal (VelociraptorServer),
  so the "misp_api" secret must be shared with that user.

type: SERVER_EVENT

parameters:
  - name: MispUrl
    default: https://10.10.10.22
  - name: MispSecret
    default: misp_api
  - name: PollSeconds
    type: int
    default: 60
  - name: LookbackDays
    type: int
    default: 7

sources:
  - query: |
      -- Internal columns avoid the names HuntId / ClientId / FlowId: source()
      -- takes those from the row scope when they are not passed explicitly,
      -- which silently turned the "already reported" lookup into a
      -- hunt_results() call.
      LET MispHunts = SELECT hunt_id AS Hunt,
             regex_replace(source=filter(list=tags, regex='^misp-event-')[0],
                           re='^misp-event-', replace='') AS Event
        FROM hunts()
        WHERE 'misp' IN tags
          AND create_time > (now() - LookbackDays * 86400) * 1000000

      LET FinishedFlows = SELECT * FROM foreach(row=MispHunts, query={
          SELECT Hunt, Event, ClientId AS Client, FlowId AS FId
          FROM hunt_flows(hunt_id=Hunt)
          WHERE Flow.state = 'FINISHED'
        })

      LET Matches(Client, FId, Event) = SELECT * FROM foreach(
          row={
            SELECT * FROM Artifact.Custom.Server.MISP.Iocs(
                MispUrl=MispUrl, MispSecret=MispSecret, EventId=Event)
          },
          query={
            SELECT AttributeId, Value, count() AS Hits, Computer
            FROM source(client_id=Client, flow_id=FId,
                        artifact='Windows.EventLogs.EvtxHunter')
            WHERE Message =~ Pattern OR serialize(item=EventData) =~ Pattern
            GROUP BY AttributeId
          })

      LET Report(Flows) = SELECT * FROM foreach(row=Flows, query={
          SELECT * FROM foreach(
            row=Matches(Client=Client, FId=FId, Event=Event),
            query={
              SELECT Hunt AS HuntId, Event AS EventId, Client AS ClientId,
                     FId AS FlowId, Computer, AttributeId, Value, Hits,
                     Response AS MispStatus
              FROM http_client(secret=MispSecret, method='POST',
                   url=MispUrl + '/sightings/add/' + AttributeId,
                   data=serialize(format='json', item=dict(
                     source=format(format='Velociraptor %v (%v) %v',
                                   args=[Computer, Client, Hunt]))))
            })
        })

      -- Flows already reported, read back from this artifact's own results.
      -- Stored queries defined with "=" are re-evaluated on every use, so
      -- each tick sees what the previous ticks wrote.
      LET Done = SELECT FlowId FROM source(
          artifact='Custom.Server.MISP.Sightings', client_id='server',
          start_time=now() - LookbackDays * 86400, end_time=now())

      LET ToReport = SELECT * FROM FinishedFlows WHERE NOT FId IN Done.FlowId

      SELECT * FROM foreach(row={ SELECT * FROM clock(period=PollSeconds) },
                            query={ SELECT * FROM Report(Flows=ToReport) })
