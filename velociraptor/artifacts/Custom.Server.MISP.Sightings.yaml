name: Custom.Server.MISP.Sightings
author: SocForge
description: |
  Server monitoring artifact: closes the loop from Velociraptor back to
  MISP.

  It reacts to System.Flow.Completion. When a client flow of a hunt tagged
  "misp" (created by Custom.Server.MISP.IOCHunt) finishes, it matches the
  rows of the hunt (Windows.EventLogs.EvtxHunter on Windows,
  Custom.Linux.IOC.LogHunter on Linux) against the IOCs of the MISP event named in the hunt tag
  ("misp-event-<id>") and adds one MISP sighting per IOC seen on the
  endpoint. The sighting source names the host, the client and the hunt.

  A hunt's client flow is named after the hunt: flow "F.<x>.H" belongs to
  hunt "H.<x>".

  At startup it first catches up: flows of recent misp hunts that finished
  while the server (or this monitoring) was down, and that it never
  reported, are reported once. It then only waits for completion events.

  The server runs this query as its own principal (VelociraptorServer),
  so the "misp_api" secret must be shared with that user.

type: SERVER_EVENT

parameters:
  - name: MispUrl
    default: https://10.10.10.22
  - name: MispSecret
    default: misp_api
  - name: LookbackDays
    type: int
    default: 7

sources:
  - query: |
      -- Internal columns avoid the names HuntId / ClientId / FlowId: source()
      -- takes those from the row scope when they are not passed explicitly,
      -- which silently turned the "already reported" lookup into a
      -- hunt_results() call.
      LET MispEvent(Hunt) = SELECT
             regex_replace(source=filter(list=tags, regex='^misp-event-')[0],
                           re='^misp-event-', replace='') AS Event
        FROM hunts(hunt_id=Hunt)
        WHERE 'misp' IN tags

      LET Rows(Client, FId) = SELECT * FROM chain(
          windows={
            SELECT Computer, Message, serialize(item=EventData) AS Data
            FROM source(client_id=Client, flow_id=FId,
                        artifact='Windows.EventLogs.EvtxHunter')
          },
          linux={
            SELECT Computer, Message, '' AS Data
            FROM source(client_id=Client, flow_id=FId,
                        artifact='Custom.Linux.IOC.LogHunter')
          })

      LET Matches(Client, FId, Event) = SELECT * FROM foreach(
          row={
            SELECT * FROM Artifact.Custom.Server.MISP.Iocs(
                MispUrl=MispUrl, MispSecret=MispSecret, EventId=Event)
          },
          query={
            SELECT AttributeId, Value, count() AS Hits, Computer
            FROM Rows(Client=Client, FId=FId)
            WHERE Message =~ Pattern OR Data =~ Pattern
            GROUP BY AttributeId
          })

      LET Report(Hunt, Client, FId) = SELECT * FROM foreach(
          row=MispEvent(Hunt=Hunt),
          query={
            SELECT * FROM foreach(
              row=Matches(Client=Client, FId=FId, Event=Event),
              query={
                SELECT Hunt AS HuntId, Event AS EventId, Client AS ClientId,
                       FId AS FlowId, Computer, AttributeId, Value, Hits,
                       Response AS MispStatus
                FROM http_client(secret=MispSecret, method='POST',
                     url=MispUrl + '/sightings/add/' + AttributeId,
                     data=serialize(format='json', item=dict(
                       source=format(format='Velociraptor %v (%v) %v',
                                     args=[Computer, Client, Hunt]))))
              })
          })

      -- Catch-up, run once at startup: finished flows of recent misp hunts
      -- that this artifact never reported (read back from its own results).
      LET Done <= SELECT FlowId FROM source(
          artifact='Custom.Server.MISP.Sightings', client_id='server',
          start_time=now() - LookbackDays * 86400, end_time=now())

      LET Missed = SELECT * FROM foreach(
          row={
            SELECT hunt_id AS Hunt FROM hunts()
            WHERE 'misp' IN tags
              AND create_time > (now() - LookbackDays * 86400) * 1000000
          },
          query={
            SELECT Hunt, ClientId AS Client, FlowId AS FId
            FROM hunt_flows(hunt_id=Hunt)
            WHERE Flow.state = 'FINISHED' AND NOT FlowId IN Done.FlowId
          })

      -- Live: one completion event per finished client flow of a hunt. The
      -- event's Flow carries no request (Flow.request is null), so the flow is
      -- selected on the artifacts that returned rows: a hunt flow without
      -- hits has nothing to report anyway.
      LET Completed = SELECT ClientId AS Client, FlowId AS FId,
             'H.' + regex_replace(source=FlowId, re='''^F\.(.+)\.H$''', replace='$1') AS Hunt
        FROM watch_monitoring(artifact='System.Flow.Completion')
        WHERE FlowId =~ '''\.H$'''
          AND ('Windows.EventLogs.EvtxHunter' IN Flow.artifacts_with_results
               OR 'Custom.Linux.IOC.LogHunter' IN Flow.artifacts_with_results)

      SELECT * FROM chain(
        catchup={
          SELECT * FROM foreach(row=Missed,
            query={ SELECT * FROM Report(Hunt=Hunt, Client=Client, FId=FId) })
        },
        live={
          SELECT * FROM foreach(row=Completed,
            query={ SELECT * FROM Report(Hunt=Hunt, Client=Client, FId=FId) })
        })
