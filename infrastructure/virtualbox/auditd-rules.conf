# SocForge auditd Rules — VM11-LINUX01
# Déployé sur: /etc/audit/rules.d/socforge.rules
# Chargement: augenrules --load && systemctl restart auditd

## Supprimer règles existantes
-D

## Buffer
-b 8192

## Niveau de défaillance: 1=log, 2=panic
-f 1

## ============================================================
## AUTHENTIFICATION ET SESSIONS
## ============================================================

# Connexions SSH
-w /var/log/auth.log -p wa -k auth_log
-w /var/log/secure -p wa -k auth_log

# Fichiers PAM
-w /etc/pam.d/ -p wa -k pam_config

# Commandes su/sudo
-w /bin/su -p x -k privilege_escalation
-w /usr/bin/sudo -p x -k privilege_escalation
-w /etc/sudoers -p wa -k sudoers_change
-w /etc/sudoers.d/ -p wa -k sudoers_change

## ============================================================
## GESTION DES COMPTES
## ============================================================

-w /etc/passwd -p wa -k user_accounts
-w /etc/shadow -p wa -k user_accounts
-w /etc/group -p wa -k group_accounts
-w /etc/gshadow -p wa -k group_accounts
-w /usr/sbin/useradd -p x -k user_mgmt
-w /usr/sbin/userdel -p x -k user_mgmt
-w /usr/sbin/usermod -p x -k user_mgmt
-w /usr/sbin/groupadd -p x -k group_mgmt
-w /usr/sbin/groupdel -p x -k group_mgmt

## ============================================================
## CRON ET TÂCHES PLANIFIÉES
## ============================================================

-w /etc/cron.allow -p wa -k cron_config
-w /etc/cron.deny -p wa -k cron_config
-w /etc/cron.d/ -p wa -k cron_config
-w /etc/cron.daily/ -p wa -k cron_config
-w /etc/cron.hourly/ -p wa -k cron_config
-w /etc/cron.monthly/ -p wa -k cron_config
-w /etc/cron.weekly/ -p wa -k cron_config
-w /etc/crontab -p wa -k cron_config
-w /var/spool/cron/ -p wa -k cron_user

## ============================================================
## FICHIERS SENSIBLES — FILE INTEGRITY MONITORING
## ============================================================

-w /etc/hosts -p wa -k hosts_file
-w /etc/hostname -p wa -k hostname_change
-w /etc/resolv.conf -p wa -k dns_config
-w /etc/ssh/sshd_config -p wa -k ssh_config
-w /etc/ssh/ssh_config -p wa -k ssh_config
-w /etc/fstab -p wa -k fstab_change
-w /etc/ld.so.conf -p wa -k lib_config

## ============================================================
## OUTILS RÉSEAU (exécution suspecte)
## ============================================================

-w /usr/bin/nmap -p x -k network_recon
-w /usr/bin/nc -p x -k network_tool
-w /usr/bin/netcat -p x -k network_tool
-w /usr/bin/tcpdump -p x -k packet_capture
-w /usr/bin/curl -p x -k download_tool
-w /usr/bin/wget -p x -k download_tool

## ============================================================
## APPELS SYSTÈME SUSPECTS
## ============================================================

# Tentatives ptrace (injection mémoire)
-a always,exit -F arch=b64 -S ptrace -k process_injection
-a always,exit -F arch=b32 -S ptrace -k process_injection

# Modules kernel
-w /sbin/insmod -p x -k kernel_module
-w /sbin/rmmod -p x -k kernel_module
-w /sbin/modprobe -p x -k kernel_module

# chmod sur fichiers sensibles
-a always,exit -F arch=b64 -S chmod -S fchmod -S chown -S fchown -F auid>=1000 -k file_perm

## ============================================================
## DÉTECTION ESCALADE DE PRIVILÈGES
## ============================================================

-a always,exit -F arch=b64 -S setuid -S setgid -S setreuid -S setregid -k privilege_change
-a always,exit -F arch=b32 -S setuid -S setgid -S setreuid -S setregid -k privilege_change

## Rendre les règles immuables (décommentez en production)
## -e 2
