# SocForge — Docker Compose pour services SOC
# VM03-THEHIVE / VM04-CORTEX / VM05-MISP / VM06-SHUFFLE
# Usage: docker compose -f docker-compose-soc.yml up -d
# Note: Chaque service tourne sur sa propre VM — ce fichier est un
#       référentiel de configuration, pas déployé sur une seule machine.

version: "3.8"

services:

  # ============================================================
  # TheHive 5 — VM03 (10.10.10.20)
  # ============================================================
  thehive:
    image: strangebee/thehive:5.2
    container_name: thehive
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - TZ=Europe/Paris
    volumes:
      - thehive_data:/opt/thp/thehive/data
      - thehive_index:/opt/thp/thehive/index
      - ./thehive/application.conf:/etc/thehive/application.conf
    networks:
      - soc_net

  # ============================================================
  # Cortex 3 — VM04 (10.10.10.21)
  # ============================================================
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - job_directory=/tmp/cortex-jobs
    volumes:
      - cortex_data:/var/run/cortex
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cortex/application.conf:/etc/cortex/application.conf
    networks:
      - soc_net

  # ============================================================
  # MISP — VM05 (10.10.10.22)
  # ============================================================
  misp:
    image: ghcr.io/nukib/misp:latest
    container_name: misp
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      - MISP_BASEURL=https://10.10.10.22
      - MISP_EMAIL=admin@socforge.lab
      - MISP_ADMIN_PASSPHRASE=${MISP_ADMIN_PASSPHRASE}
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - misp_data:/var/www/MISP/app/files
      - misp_logs:/var/www/MISP/app/tmp/logs
    depends_on:
      - misp-db
    networks:
      - soc_net

  misp-db:
    image: mysql:8.0
    container_name: misp-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - misp_db_data:/var/lib/mysql
    networks:
      - soc_net

  # ============================================================
  # Shuffle SOAR — VM06 (10.10.10.30)
  # ============================================================
  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
      - "3443:443"
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    networks:
      - soc_net

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DATASTORE_EMULATOR_HOST=shuffle-database:8000
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - SHUFFLE_DEFAULT_USERNAME=admin
      - SHUFFLE_DEFAULT_PASSWORD=${SHUFFLE_DEFAULT_PASSWORD}
      - SHUFFLE_DEFAULT_APIKEY=${SHUFFLE_DEFAULT_APIKEY}
    volumes:
      - shuffle_apps:/shuffle-apps
      - shuffle_files:/shuffle-files
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soc_net

  shuffle-database:
    image: frebib/etcd:latest
    container_name: shuffle-database
    restart: unless-stopped
    volumes:
      - shuffle_db:/etcd-data
    networks:
      - soc_net

volumes:
  thehive_data:
  thehive_index:
  cortex_data:
  misp_data:
  misp_logs:
  misp_db_data:
  shuffle_apps:
  shuffle_files:
  shuffle_db:

networks:
  soc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
