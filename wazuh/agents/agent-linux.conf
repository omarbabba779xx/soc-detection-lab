<!-- SocForge Wazuh Agent Shared Configuration — Linux -->
<!-- Deployed via Wazuh Manager -> /var/ossec/etc/shared/linux/agent.conf -->
<!-- Applied to: LINUX01 (group "linux") -->

<agent_config>

  <!-- ============================================================ -->
  <!-- AUTHENTICATION / SUDO LOGS                                    -->
  <!-- Already covered by the base ruleset via journald/PAM (rule    -->
  <!-- 5402 -> 100200) — no extra localfile needed, journald is read -->
  <!-- by default on systemd hosts.                                  -->
  <!-- ============================================================ -->

  <!-- ============================================================ -->
  <!-- FILE INTEGRITY MONITORING                                     -->
  <!-- T1053.003 (rule 100210) — cron persistence                    -->
  <!-- ============================================================ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/cron.d</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/cron.daily</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/cron.hourly</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/cron.weekly</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/cron.monthly</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/spool/cron</directories>
    <directories check_all="yes" report_changes="yes">/etc</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
  </syscheck>

  <!-- ============================================================ -->
  <!-- ACTIVE RESPONSE                                               -->
  <!-- Disabled for automatic execution — manual validation only    -->
  <!-- ============================================================ -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

</agent_config>
