<!-- SocForge Wazuh shared configuration — group "ndr" -->
<!-- Deployed to /var/ossec/etc/shared/ndr/agent.conf -->
<!-- Applied to: VM07-NDR (Suricata 6 + Zeek sensor on socforge-mgmt) -->

<agent_config>

  <!-- Suricata EVE output. Decoded by the built-in JSON decoder; Suricata alerts
       (event_type "alert") land on rule 86601, other event types stay at level 0. -->
  <localfile>
    <location>/var/log/suricata/eve.json</location>
    <log_format>json</log_format>
  </localfile>

  <!-- The sensor itself: logins and privilege use -->
  <localfile>
    <location>/var/log/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>

</agent_config>
