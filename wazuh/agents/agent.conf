<!-- SocForge Wazuh Agent Shared Configuration -->
<!-- Deployed via Wazuh Manager → /var/ossec/etc/shared/windows/agent.conf -->
<!-- Applied to: DC01 (Agent 002), WIN01 (Agent 003) -->

<agent_config>

  <!-- ============================================================ -->
  <!-- WINDOWS AUDIT LOGS                                           -->
  <!-- ============================================================ -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4624 or EventID=4625 or EventID=4634 or EventID=4648 or EventID=4688 or EventID=4698 or EventID=4702 or EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4728 or EventID=4732 or EventID=4738 or EventID=4756 or EventID=4768 or EventID=4769 or EventID=4771 or EventID=4776 or EventID=5140 or EventID=5145)]]</query>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or Level=3)]]</query>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2)]]</query>
  </localfile>

  <!-- ============================================================ -->
  <!-- POWERSHELL SCRIPT BLOCK LOGGING                              -->
  <!-- EventID 4104 = ScriptBlock, 4103 = Module Logging           -->
  <!-- ============================================================ -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4104 or EventID=4103 or EventID=4105 or EventID=4106)]]</query>
  </localfile>

  <!-- ============================================================ -->
  <!-- SYSMON (si déployé sur WIN01)                               -->
  <!-- ============================================================ -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- ============================================================ -->
  <!-- WINDOWS DEFENDER                                             -->
  <!-- ============================================================ -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=1116 or EventID=1117 or EventID=1006 or EventID=1007)]]</query>
  </localfile>

  <!-- ============================================================ -->
  <!-- FILE INTEGRITY MONITORING                                    -->
  <!-- ============================================================ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" report_changes="yes" realtime="yes">%WINDIR%\System32\drivers\etc</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">%WINDIR%\System32\Tasks</directories>
    <directories check_all="yes" report_changes="yes">%PROGRAMFILES%</directories>
    <directories check_all="yes" report_changes="yes">%PROGRAMFILES(X86)%</directories>

    <ignore>%WINDIR%\System32\LogFiles</ignore>
    <ignore>%WINDIR%\System32\wbem\Logs</ignore>

    <windows_registry>HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>
  </syscheck>

  <!-- ============================================================ -->
  <!-- ACTIVE RESPONSE                                              -->
  <!-- Disabled for automatic execution — manual validation only   -->
  <!-- ============================================================ -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

</agent_config>
