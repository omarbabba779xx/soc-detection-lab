# SocForge — Suricata Configuration
# VM07-NDR: /etc/suricata/suricata.yaml (extrait des sections SocForge)
# Suricata 7.x — Ubuntu Server 22.04

%YAML 1.1
---

vars:
  address-groups:
    HOME_NET: "[10.10.10.0/24,10.10.20.0/24,10.10.30.0/24,10.10.50.0/24,10.10.60.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "[10.10.10.109]"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "[10.10.10.109]"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"

  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544

af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

# Sortie EVE JSON pour intégration Wazuh
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      rotate-interval: hour
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            http-body: yes
            http-body-printable: yes
            tagged-packets: yes
            xff:
              enabled: yes
              mode: extra-data
              deployment: reverse
              header: X-Forwarded-For
        - http:
            extended: yes
        - dns:
            version: 2
            requests: yes
            responses: yes
        - tls:
            extended: yes
        - files:
            force-magic: no
        - smtp: {}
        - ftp: {}
        - smb: {}
        - rdp: {}
        - ntlm: {}
        - flow: {}
        - netflow: {}
        - stats:
            totals: yes
            threads: no
            deltas: no
        - anomaly:
            enabled: yes

# Règles
rule-files:
  - /etc/suricata/rules/emerging-scan.rules
  - /etc/suricata/rules/emerging-malware.rules
  - /etc/suricata/rules/emerging-exploit.rules
  - /etc/suricata/rules/emerging-trojan.rules
  - /etc/suricata/rules/emerging-policy.rules
  - /etc/suricata/rules/socforge-custom.rules

# Performance
threading:
  set-cpu-affinity: no
  cpu-affinity:
    - management-cpu-set:
        cpu: [0]
    - receive-cpu-set:
        cpu: [0]
    - worker-cpu-set:
        cpu: ["all"]
        mode: "exclusive"
        prio:
          low: [0]
          medium: ["1-2"]
          high: ["3"]
          default: "medium"
  detect-thread-ratio: 1.0

# Limites mémoire (adapter selon RAM disponible)
stream:
  memcap: 64mb
  checksum-validation: no
  inline: auto
  reassembly:
    memcap: 256mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes
