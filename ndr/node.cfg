# Zeek cluster on VM07-NDR (/opt/zeek/etc/node.cfg): one worker per sniffed network.
# Started at boot by /etc/cron.d/zeek-start (zeekctl).

[logger]
type=logger
host=localhost

[manager]
type=manager
host=localhost

[proxy-1]
type=proxy
host=localhost

# socforge-mgmt (SOC network)
[worker-mgmt]
type=worker
host=localhost
interface=enp0s8

# socforge-purple (attacker zone, passive tap)
[worker-purple]
type=worker
host=localhost
interface=enp0s10
